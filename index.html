<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[page title]</title>
<meta name="description" content="" />
<meta name="theme-color" content="#0e1512" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=PT+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="assets/css/altamaha.css" />
</head>
<body>

<div id="map" aria-label="Map of the Altamaha River delta"></div>

<div class="swipe" id="swipe" aria-hidden="true">
  <div class="swipe-line"></div>
  <button class="swipe-handle" id="swipeHandle" type="button" aria-label="Drag to compare infrared and true color" title="Drag to compare">&#x2194;</button>
  <span class="swipe-tag swipe-tag-left">Near-infrared</span>
  <span class="swipe-tag swipe-tag-right">True color</span>
</div>

<aside class="panel" id="panel">
  <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true" aria-controls="panelBody">
    <span class="panel-eyebrow ph">[eyebrow]</span>
    <span class="panel-chevron" aria-hidden="true">&#9662;</span>
  </button>
  <h1 class="ph">[title]</h1>
  <p class="panel-sub ph">[subtitle]</p>

  <div class="panel-body" id="panelBody">
    <p class="ph">[intro paragraph]</p>
    <p class="ph">[how to read the map]</p>

    <div class="legend">
      <div><span class="sw sw-red"></span><span class="ph">[legend: red]</span></div>
      <div><span class="sw sw-pink"></span><span class="ph">[legend: pink]</span></div>
      <div><span class="sw sw-cyan"></span><span class="ph">[legend: cyan]</span></div>
      <div><span class="sw sw-dark"></span><span class="ph">[legend: dark]</span></div>
    </div>

    <fieldset class="controls">
      <legend>Layers</legend>
      <label><input type="checkbox" id="optTerrain" checked /> Lidar terrain shading</label>
      <label><input type="checkbox" id="optPlaces" checked /> Place notes</label>
      <label class="select-row" id="sourceRow">Infrared source
        <select id="optSource">
          <option value="sentinel">Sentinel-2 (10 m)</option>
          <option value="landsat">Landsat (30 m)</option>
        </select>
      </label>
    </fieldset>

    <p class="credits ph">[credits: imagery, terrain and data sources]</p>
  </div>
</aside>

<a class="back-link ph" href="https://zanderhirman08.github.io/CRCProjects-/">[back link label]</a>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/altamaha.js"></script>
</body>
</html>
